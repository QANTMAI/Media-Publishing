name: CI

# Enforces the gates that were previously local-only (audit finding T1): a
# regression can no longer merge to main unchecked. Every step here passes
# locally today (tsc, lint, build, 98/98 isolated tests).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma client
        run: npx prisma generate

      - name: Ephemeral secrets (test/build env only — never real)
        run: |
          {
            echo "SESSION_SECRET=$(openssl rand -base64 32)"
            echo "VAULT_MASTER_KEY=$(openssl rand -base64 32)"
            echo "STORAGE_SIGNING_KEY=$(openssl rand -base64 32)"
            echo "DATABASE_URL=file:./dev.db"
            echo "OAUTH_MOCK=1"
          } > .env

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx next build

      - name: Test (isolated suite — own server + own DB)
        run: npm test
